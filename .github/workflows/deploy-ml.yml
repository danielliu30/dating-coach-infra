name: Deploy — ML analyzer

# Analyzer path of the release pipeline. dating-coach-ml is private (callers
# authenticate with Google ID tokens), so there is no public traffic split to
# walk: deploy a tagged candidate revision, verify it reports Ready, promote.
on:
  repository_dispatch:
    types: [app-merge]
  workflow_dispatch:
    inputs:
      app_sha:
        description: >-
          App-repo commit to build/deploy (defaults to the app repo's current
          main). Ignored when image_tag is set.
        required: false
        default: ""
      image_tag:
        description: >-
          Deploy an already-published ml-analyzer image tag instead of
          building. Restores skip the release window.
        required: false
        default: ""

concurrency:
  group: deploy-ml
  cancel-in-progress: false

env:
  APP_REPO: danielliu30/dating-coach
  APP_SHA: ${{ github.event.client_payload.sha || inputs.app_sha }}
  APP_BEFORE: ${{ github.event.client_payload.before }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  DEPLOY_TAG: ${{ inputs.image_tag || github.event.client_payload.sha || inputs.app_sha }}

jobs:
  changed:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Resolve app SHA
        id: sha
        run: |
          sha="$APP_SHA"
          if [ -z "$sha" ]; then
            sha=$(git ls-remote "https://github.com/$APP_REPO" main | cut -f1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
          path: app
      - name: Check whether ml-analyzer changed
        id: check
        working-directory: app
        run: |
          before="${APP_BEFORE:-}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ steps.sha.outputs.sha }}" -- ml-analyzer | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    if: ${{ !inputs.image_tag && needs.changed.outputs.deploy == 'true' }}
    needs: [changed]
    uses: ./.github/workflows/gate-e2e.yml
    with:
      app_sha: ${{ needs.changed.outputs.sha }}

  build-push:
    if: ${{ !cancelled() && !inputs.image_tag && needs.changed.outputs.deploy == 'true' }}
    needs: [changed, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ needs.changed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.changed.outputs.sha }}
          path: app
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push ml-analyzer image (tagged with the app SHA)
        working-directory: app
        run: |
          docker compose build ml-analyzer
          docker compose push ml-analyzer

      - name: Push latest tag
        run: |
          tip=$(git ls-remote "https://github.com/$APP_REPO" main | cut -f1)
          if [ "$tip" = "${{ needs.changed.outputs.sha }}" ]; then
            docker tag "$DOCKERHUB_NAMESPACE/dating-coach-ml-analyzer:$IMAGE_TAG" \
                       "$DOCKERHUB_NAMESPACE/dating-coach-ml-analyzer:latest"
            docker push "$DOCKERHUB_NAMESPACE/dating-coach-ml-analyzer:latest"
          else
            echo "app main moved past this SHA: latest left untouched"
          fi

  deploy-local:
    needs: [changed, build-push]
    if: >-
      ${{ !cancelled() && vars.DEPLOY_TARGET != 'cloud-run'
      && (inputs.image_tag != '' || (needs.changed.outputs.deploy == 'true' && needs.build-push.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Print local deploy commands
        run: |
          echo "Cloud deploy disabled (DEPLOY_TARGET is not 'cloud-run')."
          echo "Image published: docker.io/$DOCKERHUB_NAMESPACE/dating-coach-ml-analyzer:$DEPLOY_TAG"
          echo "Deploy locally (from an app-repo checkout):"
          echo "  IMAGE_TAG=$DEPLOY_TAG docker compose pull ml-analyzer"
          echo "  IMAGE_TAG=$DEPLOY_TAG docker compose up -d ml-analyzer"

  deploy:
    needs: [changed, build-push]
    if: >-
      ${{ !cancelled() && vars.DEPLOY_TARGET == 'cloud-run'
      && (inputs.image_tag != '' || (needs.changed.outputs.deploy == 'true' && needs.build-push.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      IMAGES: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
      ML_MAX_INSTANCES: ${{ vars.ML_MAX_INSTANCES || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Release window (skipped for image_tag restores)
        if: ${{ !inputs.image_tag }}
        env:
          DEPLOY_WINDOW_DAYS: ${{ vars.DEPLOY_WINDOW_DAYS }}
          DEPLOY_WINDOW_START_UTC: ${{ vars.DEPLOY_WINDOW_START_UTC }}
          DEPLOY_WINDOW_END_UTC: ${{ vars.DEPLOY_WINDOW_END_UTC }}
        run: bash scripts/release-window.sh

      - name: Deploy candidate revision (tagged, no traffic)
        run: |
          gcloud run deploy dating-coach-ml --project "$PROJECT" --region "$REGION" \
            --image "$IMAGES/dating-coach-ml-analyzer:$DEPLOY_TAG" \
            --tag wave-candidate --no-traffic \
            --service-account "$RUNTIME_SA" --no-allow-unauthenticated \
            --memory 1Gi --min-instances 0 --max-instances "$ML_MAX_INSTANCES" --timeout 120 \
            --set-env-vars "ML_BACKEND=llm,LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'anthropic' }},LLM_MODEL=${{ vars.LLM_MODEL || 'claude-sonnet-4-5' }}" \
            --set-secrets LLM_API_KEY=LLM_API_KEY:latest

      # The service is private and the deploy SA holds no invoker grant, so the
      # gate is revision readiness — a deeper smoke can be wired through the
      # api/worker callers later.
      - name: Wait for the candidate revision to report Ready
        run: |
          rev="$(gcloud run services describe dating-coach-ml --project "$PROJECT" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          for i in $(seq 1 30); do
            ready="$(gcloud run revisions describe "$rev" --project "$PROJECT" --region "$REGION" \
              --format='json(status.conditions)' | grep -A2 '"type": "Ready"' | grep -c '"status": "True"' || true)"
            [ "$ready" -ge 1 ] && { echo "$rev ready"; exit 0; }
            sleep 4
          done
          echo "revision $rev never became Ready"; exit 1

      - name: Promote to 100%
        run: |
          gcloud run services update-traffic dating-coach-ml \
            --project "$PROJECT" --region "$REGION" --to-latest

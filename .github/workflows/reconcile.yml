name: Reconcile deploy drift

# Safety net for a lost repository_dispatch(app-merge): hourly, compare every
# Cloud Run service's deployed image tag to the app repo's main tip and fail
# (loudly) when a service has been behind for longer than GRACE_MINUTES.
#
# NOTE: this workflow only obtains WIF credentials because the bootstrap
# attribute-condition lists it — after merging, re-run scripts/gcp-bootstrap.sh
# once so the provider's workflow_ref condition picks up reconcile.yml.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    # Scheduled runs always execute on main; the ref guard also keeps a
    # manual dispatch on another branch from ever reaching WIF auth.
    if: ${{ vars.DEPLOY_TARGET == 'cloud-run' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      APP_REPO: danielliu30/dating-coach
      GRACE_MINUTES: ${{ vars.RECONCILE_GRACE_MINUTES || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Reconcile deployed tags against app main
        run: bash scripts/reconcile-drift.sh

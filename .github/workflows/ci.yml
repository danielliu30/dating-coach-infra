name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh
      - run: bash scripts/test-release-window.sh
      - run: bash scripts/test-deploy-bake-check.sh
      - run: bash scripts/test-deploy-probe-suite.sh
      - run: bash scripts/test-deploy-waves.sh
      - run: bash scripts/test-monitoring-alerts.sh
